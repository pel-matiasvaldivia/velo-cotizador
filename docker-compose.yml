version: '3.9'

services:
  # ─────────────────────────────────────────
  # FRONTEND — React + Nginx
  # ─────────────────────────────────────────
  frontend:
    image: ghcr.io/pel-matiasvaldivia/velo-cotizador-frontend:latest
    container_name: velo-frontend
    restart: unless-stopped
    ports:
      - "8500:80"
    environment:
      - VITE_API_URL=${API_URL}
      - VITE_WS_URL=${WS_URL}
    networks:
      - velo-network
    depends_on:
      - backend

  # ─────────────────────────────────────────
  # BACKEND — NestJS
  # ─────────────────────────────────────────
  backend:
    image: ghcr.io/pel-matiasvaldivia/velo-cotizador-backend:latest
    container_name: velo-backend
    restart: unless-stopped
    ports:
      - "3101:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_COMERCIAL=${EMAIL_COMERCIAL}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - velo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # BASE DE DATOS — PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: velo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velo-network

  # ─────────────────────────────────────────
  # CACHÉ / SESIONES — Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: velo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velo-network

  # ─────────────────────────────────────────
  # ALMACENAMIENTO — MinIO (PDFs)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: velo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      - velo-network

networks:
  velo-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
